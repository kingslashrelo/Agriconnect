<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 22px;
    font-size: 14px;
    overflow: hidden;
  }
  #btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(128, 128, 128, 0.55);
    background: transparent;
    color: inherit;
    border-radius: 6px;
    padding: 3px 12px;
    font: inherit;
    line-height: 1.5;
    cursor: pointer;
    white-space: nowrap;
  }
  #btn:hover:not(:disabled) { filter: brightness(1.15); }
  #btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #btn:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  #status { font-size: 12.5px; opacity: 0.85; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <button id="btn" type="button" title="Fetch weather for my current location">📍 Locate</button>
  <span id="status"></span>
</div>
<script>
(function () {
  var btn = document.getElementById("btn");
  var status = document.getElementById("status");
  var themed = false;

  function post(msg) {
    msg.isStreamlitMessage = true;
    parent.postMessage(msg, "*");
  }
  function frame() {
    post({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight });
  }
  function applyTheme(theme) {
    if (!theme || themed) return;
    themed = true;
    if (theme.primaryColor) {
      btn.style.borderColor = theme.primaryColor;
      btn.style.color = theme.primaryColor;
    }
    if (theme.textColor) document.body.style.color = theme.textColor;
    if (theme.font) document.body.style.fontFamily = theme.font;
  }
  function report(text) {
    post({
      type: "streamlit:setComponentValue",
      value: { error: text, ts: Date.now() }
    });
  }
  function unsupported(reason) {
    btn.disabled = true;
    btn.title = reason;
    post({ type: "streamlit:componentReady", apiVersion: 1 });
    report(reason);
    frame();
  }

  window.addEventListener("message", function (ev) {
    var msg = ev.data;
    if (!msg || typeof msg !== "object" || !msg.isStreamlitMessage) return;
    if (msg.type === "streamlit:render") {
      if (!btn.disabled) btn.disabled = !!msg.disabled;
      applyTheme(msg.theme);
      frame();
    }
  });

  if (!navigator.geolocation) {
    unsupported("This browser can't share location — type your place instead.");
    return;
  }
  if (!window.isSecureContext) {
    unsupported("Location needs HTTPS or localhost — type your place instead.");
    return;
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    status.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        post({
          type: "streamlit:setComponentValue",
          value: {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            ts: Date.now()
          }
        });
        status.textContent = "";
        btn.disabled = false;
      },
      function (err) {
        var text =
          err.code === 1 ? "Location permission denied." :
          err.code === 2 ? "Location unavailable." :
          err.code === 3 ? "Location request timed out." :
          "Location failed.";
        report(text);
        status.textContent = "";
        btn.disabled = false;
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
  });

  post({ type: "streamlit:componentReady", apiVersion: 1 });
  frame();
})();
</script>
</body>
</html>
