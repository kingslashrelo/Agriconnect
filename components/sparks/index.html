<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; height: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script>
(function () {
  var EASINGS = {
    linear: function (t) { return t; },
    "ease-in": function (t) { return t * t; },
    "ease-out": function (t) { return 1 - Math.pow(1 - t, 3); },
    "ease-in-out": function (t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    },
    spring: function (t) {
      return 1 + 2.4 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);
    }
  };

  var SHAPES = ["line", "streak", "dot", "star"];
  var MAX_BURSTS = 32;
  var GRAVITY = 500;
  var REDUCED_MS = 320;

  var SETTINGS = {
    colors: ["#43552F", "#738A52", "#8EA065"],
    size: 14,
    radius: 30,
    count: 8,
    width: 2,
    duration: 500,
    ease: EASINGS["ease-out"],
    shape: "line",
    randomness: 0.2,
    gravity: 0,
    spread: 360,
    direction: 0,
    glow: 0,
    ring: false
  };

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

  function smoothstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function starPath(ctx, x, y, radius, rotation) {
    var pinch = radius * 0.16;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(rotation) * radius, y + Math.sin(rotation) * radius);
    for (var i = 1; i <= 4; i++) {
      var a = rotation + (i * Math.PI) / 2;
      var mid = a - Math.PI / 4;
      ctx.quadraticCurveTo(
        x + Math.cos(mid) * pinch,
        y + Math.sin(mid) * pinch,
        x + Math.cos(a) * radius,
        y + Math.sin(a) * radius
      );
    }
    ctx.closePath();
  }

  function channels(ctx, color) {
    ctx.fillStyle = color;
    var normal = String(ctx.fillStyle);
    var hex = /^#([0-9a-f]{6})$/i.exec(normal);
    if (hex) {
      var value = parseInt(hex[1], 16);
      return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    }
    var rgb = /^rgba?\(([^)]+)\)$/i.exec(normal);
    if (rgb) {
      return rgb[1].split(",").slice(0, 3).map(function (p) { return parseFloat(p); });
    }
    return [0, 0, 0];
  }

  function resolveDoc() {
    try {
      var d = window.parent && window.parent.document;
      if (d && d.body) return d;
    } catch (e) {}
    return document;
  }

  function init() {
    var host = resolveDoc();
    var reduced = false;
    try {
      reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}

    if (host.__agriSparks) return;
    host.__agriSparks = true;

    var layer = host.createElement("div");
    layer.setAttribute("aria-hidden", "true");
    layer.style.cssText =
      "position:fixed;inset:0;z-index:2147483000;overflow:visible;pointer-events:none;";
    (host.body || host.documentElement).appendChild(layer);

    var bursts = [];
    var raf = 0;
    var lastPress = { time: -1e9, x: 0, y: 0 };

    function drop(seconds) { return 0.5 * SETTINGS.gravity * GRAVITY * seconds * seconds; }

    function position(burst, spark, distance, seconds) {
      return [
        burst.x + Math.cos(spark.angle) * distance,
        burst.y + Math.sin(spark.angle) * distance + drop(seconds)
      ];
    }

    function drawSpark(ctx, burst, spark, elapsed) {
      var life = reduced ? REDUCED_MS : SETTINGS.duration * spark.life;
      var p = elapsed / life;
      if (p >= 1) return false;
      var e = reduced ? 0.55 : SETTINGS.ease(clamp(p, 0, 1));
      var seconds = reduced ? 0 : elapsed / 1000;
      var distance = SETTINGS.radius * spark.reach * e;
      var width = SETTINGS.width * spark.scale;
      var fade = reduced ? 1 - p : 1 - smoothstep(SETTINGS.shape === "line" ? 0.55 : 0.7, 1, p);
      if (fade <= 0) return true;
      ctx.strokeStyle = spark.color;
      ctx.fillStyle = spark.color;

      if (SETTINGS.shape === "line") {
        var length = SETTINGS.size * spark.scale * (reduced ? 0.5 : Math.pow(1 - p, 1.6));
        var a = position(burst, spark, distance, seconds);
        var b = position(burst, spark, distance + Math.max(0.01, length), seconds);
        ctx.lineCap = "round";
        if (spark.glow > 0) {
          ctx.globalAlpha = fade * 0.14 * spark.glow;
          ctx.lineWidth = width * 4.5;
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
          ctx.stroke();
        }
        ctx.globalAlpha = fade;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
        return true;
      }

      if (SETTINGS.shape === "streak") {
        var lag = reduced ? 0 : Math.min(elapsed, 70 + SETTINGS.size * 4 * spark.scale);
        var back = reduced ? 0.4 : SETTINGS.ease(clamp((elapsed - lag) / life, 0, 1));
        var head = position(burst, spark, distance, seconds);
        var tail = position(
          burst,
          spark,
          SETTINGS.radius * spark.reach * back,
          Math.max(0, seconds - lag / 1000)
        );
        var dx = head[0] - tail[0];
        var dy = head[1] - tail[1];
        var len = Math.hypot(dx, dy) || 1;
        var nx = (-dy / len) * width * 0.5;
        var ny = (dx / len) * width * 0.5;
        var paint = function (spreadWidth, alpha) {
          var gradient = ctx.createLinearGradient(tail[0], tail[1], head[0], head[1]);
          gradient.addColorStop(0, spark.clear);
          gradient.addColorStop(1, spark.color);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.moveTo(tail[0], tail[1]);
          ctx.lineTo(head[0] + nx * spreadWidth, head[1] + ny * spreadWidth);
          ctx.lineTo(head[0] - nx * spreadWidth, head[1] - ny * spreadWidth);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = spark.color;
          ctx.beginPath();
          ctx.arc(head[0], head[1], width * 0.5 * spreadWidth, 0, Math.PI * 2);
          ctx.fill();
        };
        if (spark.glow > 0) paint(3.2, fade * 0.16 * spark.glow);
        paint(1, fade);
        return true;
      }

      if (SETTINGS.shape === "dot") {
        var d = position(burst, spark, distance, seconds);
        var radius = width * 1.25 * (1 - 0.5 * e);
        if (spark.glow > 0) {
          ctx.globalAlpha = fade * 0.18 * spark.glow;
          ctx.beginPath();
          ctx.arc(d[0], d[1], radius * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = fade;
        ctx.beginPath();
        ctx.arc(d[0], d[1], radius, 0, Math.PI * 2);
        ctx.fill();
        return true;
      }

      var s = position(burst, spark, distance, seconds);
      var twinkle = reduced ? 1 - p : Math.pow(Math.sin(Math.PI * clamp(p * 1.1, 0, 1)), 0.7);
      var sr = SETTINGS.size * 0.6 * spark.scale * twinkle;
      var rotation = spark.angle + spark.spin * p * Math.PI * 0.5;
      if (sr <= 0.05) return true;
      if (spark.glow > 0) {
        ctx.globalAlpha = fade * 0.2 * spark.glow;
        ctx.beginPath();
        ctx.arc(s[0], s[1], sr * 1.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = fade;
      starPath(ctx, s[0], s[1], sr, rotation);
      ctx.fill();
      return true;
    }

    function drawRing(ctx, burst, elapsed) {
      var life = reduced ? REDUCED_MS : SETTINGS.duration * 0.8;
      var p = elapsed / life;
      if (p >= 1) return false;
      var radius = 2 + SETTINGS.radius * 0.6 * (reduced ? 0.6 : EASINGS["ease-out"](p));
      ctx.globalAlpha = Math.pow(1 - p, 2) * 0.7;
      ctx.strokeStyle = (burst.sparks[0] && burst.sparks[0].color) || SETTINGS.colors[0];
      ctx.lineWidth = Math.max(0.5, SETTINGS.width * (1 - p) * 0.9);
      ctx.beginPath();
      ctx.arc(burst.x, burst.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      return true;
    }

    function remove(burst) {
      if (burst.canvas.parentNode) burst.canvas.parentNode.removeChild(burst.canvas);
      var index = bursts.indexOf(burst);
      if (index >= 0) bursts.splice(index, 1);
    }

    function frame(now) {
      raf = 0;
      for (var i = 0; i < bursts.length; i++) {
        var burst = bursts[i];
        var elapsed = now - burst.start;
        var ctx = burst.ctx;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, burst.canvas.width, burst.canvas.height);
        ctx.setTransform(
          burst.ratio, 0, 0, burst.ratio,
          -burst.left * burst.ratio, -burst.top * burst.ratio
        );
        var alive = false;
        if (SETTINGS.ring && drawRing(ctx, burst, elapsed)) alive = true;
        for (var j = 0; j < burst.sparks.length; j++) {
          if (drawSpark(ctx, burst, burst.sparks[j], elapsed)) alive = true;
        }
        ctx.globalAlpha = 1;
        if (!alive) {
          remove(burst);
          i--;
        }
      }
      if (bursts.length) raf = requestAnimationFrame(frame);
    }

    function spawn(clientX, clientY) {
      var offset = Math.floor(Math.random() * SETTINGS.colors.length);
      var full = SETTINGS.spread >= 359.5;
      var arc = (SETTINGS.spread * Math.PI) / 180;
      var heading = ((SETTINGS.direction - 90) * Math.PI) / 180;
      var step = full ? (Math.PI * 2) / SETTINGS.count : SETTINGS.count > 1 ? arc / (SETTINGS.count - 1) : 0;
      var sparks = [];
      for (var i = 0; i < SETTINGS.count; i++) {
        var base = full
          ? heading + step * i
          : SETTINGS.count > 1
            ? heading - arc / 2 + step * i
            : heading;
        var jitter = (Math.random() - 0.5) * SETTINGS.randomness;
        sparks.push({
          angle: base + jitter * (step || arc || 1) * 0.9,
          reach: 1 + (Math.random() - 0.5) * 0.7 * SETTINGS.randomness,
          scale: 1 + (Math.random() - 0.5) * 0.8 * SETTINGS.randomness,
          life: 1 + (Math.random() - 0.5) * 0.5 * SETTINGS.randomness,
          spin: Math.random() - 0.5,
          color: SETTINGS.colors[(i + offset) % SETTINGS.colors.length],
          clear: "",
          glow: 0
        });
      }
      var longest = SETTINGS.duration * (1 + 0.25 * SETTINGS.randomness);
      var fall = drop(longest / 1000);
      var reach =
        SETTINGS.radius * (1 + 0.35 * SETTINGS.randomness) +
        SETTINGS.size * (1 + 0.4 * SETTINGS.randomness) +
        SETTINGS.width * (SETTINGS.glow > 0 ? 6 : 2) +
        6;
      var box = {
        left: Math.max(clientX - reach, 0),
        top: Math.max(clientY - reach, 0),
        right: Math.min(clientX + reach, window.innerWidth),
        bottom: Math.min(clientY + reach + fall, window.innerHeight)
      };
      if (box.right - box.left < 1 || box.bottom - box.top < 1) return;
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      var canvas = host.createElement("canvas");
      canvas.width = Math.ceil((box.right - box.left) * ratio);
      canvas.height = Math.ceil((box.bottom - box.top) * ratio);
      canvas.style.cssText =
        "position:absolute;left:" + box.left + "px;top:" + box.top + "px;" +
        "width:" + (box.right - box.left) + "px;height:" + (box.bottom - box.top) + "px;" +
        "display:block;pointer-events:none;";
      canvas.setAttribute("aria-hidden", "true");
      layer.appendChild(canvas);
      var ctx = canvas.getContext("2d");
      if (!ctx) {
        canvas.parentNode.removeChild(canvas);
        return;
      }
      for (var k = 0; k < sparks.length; k++) {
        var c = channels(ctx, sparks[k].color);
        sparks[k].clear = "rgba(" + c[0] + ", " + c[1] + ", " + c[2] + ", 0)";
        sparks[k].glow =
          SETTINGS.glow * (0.35 + 0.65 * ((0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255));
      }
      bursts.push({
        x: clientX,
        y: clientY,
        start: performance.now(),
        sparks: sparks,
        canvas: canvas,
        ctx: ctx,
        ratio: ratio,
        left: box.left,
        top: box.top
      });
      while (bursts.length > MAX_BURSTS) remove(bursts[0]);
      if (!raf) raf = requestAnimationFrame(frame);
    }

    function onPointerDown(event) {
      if (event.pointerType !== "mouse" || event.button !== 0) return;
      lastPress = { time: performance.now(), x: event.clientX, y: event.clientY };
      spawn(event.clientX, event.clientY);
    }

    function onClick(event) {
      if ("pointerType" in event && event.pointerType === "mouse") return;
      if (event.detail === 0) {
        var target = event.target instanceof Element ? event.target : host.body;
        var rect = target.getBoundingClientRect();
        spawn(rect.left + rect.width / 2, rect.top + rect.height / 2);
        return;
      }
      var recent =
        performance.now() - lastPress.time < 700 &&
        Math.hypot(event.clientX - lastPress.x, event.clientY - lastPress.y) < 12;
      if (!recent) spawn(event.clientX, event.clientY);
    }

    host.addEventListener("pointerdown", onPointerDown, true);
    host.addEventListener("click", onClick, true);
  }

  function post(msg) {
    msg.isStreamlitMessage = true;
    try { parent.postMessage(msg, "*"); } catch (e) {}
  }

  var reported = false;

  function handshake() {
    if (reported) return;
    reported = true;
    post({ type: "streamlit:setFrameHeight", height: 0 });
    post({ type: "streamlit:componentReady", apiVersion: 1 });
    post({ type: "streamlit:setComponentValue", value: { ready: true } });
  }

  window.addEventListener("message", function (ev) {
    var msg = ev.data;
    if (!msg || typeof msg !== "object" || !msg.isStreamlitMessage) return;
    if (msg.type !== "streamlit:render") return;
    handshake();
  });

  if (document.readyState === "complete") {
    init();
    setTimeout(handshake, 60);
  } else {
    window.addEventListener("load", function () {
      init();
      setTimeout(handshake, 60);
    });
  }
})();
</script>
</body>
</html>
